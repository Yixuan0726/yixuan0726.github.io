<!doctype html>
<html lang="zh-CN" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看 StatsShooter 当前版本的基础卡、数据卡和机制卡。">
  <meta name="theme-color" content="#201d24">
  <title>升级卡牌图鉴 · StatsShooter</title>
  <link rel="alternate" hreflang="en" href="./cards.html">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./cards.css?v=statsshooter-card-width">
  <script src="./cards-data.js?v=ricochet-catalog-50" defer></script>
  <script src="./cards.js?v=ricochet-catalog-50" defer></script>
</head>
<body class="catalog-page">
  <a class="skip-link" href="#main">跳到图鉴</a>
  <header class="site-header">
    <div class="site-bar wrap catalog-site-bar">
      <a class="wordmark" href="./index-zh.html" aria-label="StatsShooter 首页"><span aria-hidden="true" class="brand-curve"></span>StatsShooter</a>
      <div class="catalog-header-actions">
        <a class="header-trial catalog-return" href="./index-zh.html#loadout-catalog-title"><span aria-hidden="true">←</span> 卡牌强化</a>
        <nav class="catalog-language" aria-label="语言">
          <a href="./cards.html" lang="en" hreflang="en">EN</a>
          <a href="./cards-zh.html" lang="zh-CN" hreflang="zh-CN" aria-current="page">中文</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap catalog-main" id="main">
    <header class="catalog-heading">
      <p class="eyebrow" lang="en">Upgrade Cards</p>
      <h1>升级卡牌图鉴</h1>
    </header>

    <section aria-label="筛选卡牌" class="catalog-controls" hidden>
      <div class="catalog-filter-group">
        <p class="catalog-label" id="category-label">卡牌类别</p>
        <div class="catalog-categories" role="group" aria-labelledby="category-label">
          <button type="button" aria-pressed="true" data-category="">全部</button>
          <button type="button" aria-pressed="false" data-category="基础卡">基础卡</button>
          <button type="button" aria-pressed="false" data-category="数据卡">数据卡</button>
          <button type="button" aria-pressed="false" data-category="机制卡">机制卡</button>
        </div>
      </div>
      <div class="catalog-field">
        <label class="catalog-label" for="route-filter">构筑路线</label>
        <select id="route-filter">
          <option value="">所有路线</option>
          <option value="通用">通用</option>
          <option value="稳定步枪">稳定步枪</option>
          <option value="高方差霰弹">高方差霰弹</option>
        </select>
      </div>
      <div class="catalog-field catalog-search">
        <label class="catalog-label" for="card-search">搜索卡牌</label>
        <input id="card-search" type="search" placeholder="输入名称或效果" autocomplete="off">
      </div>
    </section>

    <div class="catalog-results-bar">
      <p class="catalog-count" role="status" aria-live="polite"></p>
      <button type="button" class="catalog-reset" hidden>清除筛选</button>
    </div>
    <section aria-label="卡牌列表" class="catalog-grid"></section>
    <p class="catalog-empty" hidden></p>
    <noscript><p class="catalog-empty">开启 JavaScript 后可查看卡牌图鉴。</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-bar">
      <a class="text-link" href="./index-zh.html">返回 StatsShooter 首页</a>
      <a class="text-link" href="#top">返回顶部 <span aria-hidden="true">↑</span></a>
    </div>
  </footer>
</body>
</html>

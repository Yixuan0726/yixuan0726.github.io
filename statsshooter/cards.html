<!doctype html>
<html lang="en" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the basic, data, and mechanism cards in the current version of StatsShooter.">
  <meta name="theme-color" content="#201d24">
  <title>Upgrade Card Catalog · StatsShooter</title>
  <link rel="alternate" hreflang="zh-CN" href="./cards-zh.html">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./cards.css?v=statsshooter-card-width">
  <script src="./cards-data-en.js?v=ricochet-catalog-50" defer></script>
  <script src="./cards.js?v=ricochet-catalog-50" defer></script>
</head>
<body class="catalog-page">
  <a class="skip-link" href="#main">Skip to the catalog</a>
  <header class="site-header">
    <div class="site-bar wrap catalog-site-bar">
      <a class="wordmark" href="./index.html" aria-label="StatsShooter home"><span aria-hidden="true" class="brand-curve"></span>StatsShooter</a>
      <div class="catalog-header-actions">
        <a class="header-trial catalog-return" href="./index.html#loadout-catalog-title"><span aria-hidden="true">←</span> Card Upgrades</a>
        <nav class="catalog-language" aria-label="Language">
          <a href="./cards.html" lang="en" hreflang="en" aria-current="page">EN</a>
          <a href="./cards-zh.html" lang="zh-CN" hreflang="zh-CN">中文</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="wrap catalog-main" id="main">
    <header class="catalog-heading">
      <h1>Upgrade Card Catalog</h1>
    </header>

    <section aria-label="Card filters" class="catalog-controls" hidden>
      <div class="catalog-filter-group">
        <p class="catalog-label" id="category-label">Card type</p>
        <div class="catalog-categories" role="group" aria-labelledby="category-label">
          <button type="button" aria-pressed="true" data-category="">All</button>
          <button type="button" aria-pressed="false" data-category="Basic Card">Basic</button>
          <button type="button" aria-pressed="false" data-category="Data Card">Data</button>
          <button type="button" aria-pressed="false" data-category="Mechanism Card">Mechanism</button>
        </div>
      </div>
      <div class="catalog-field">
        <label class="catalog-label" for="route-filter">Build route</label>
        <select id="route-filter">
          <option value="">All routes</option>
          <option value="General">General</option>
          <option value="Low-variance Rifle">Low-variance Rifle</option>
          <option value="High-variance Shotgun">High-variance Shotgun</option>
        </select>
      </div>
      <div class="catalog-field catalog-search">
        <label class="catalog-label" for="card-search">Search cards</label>
        <input id="card-search" type="search" placeholder="Search by name or effect" autocomplete="off">
      </div>
    </section>

    <div class="catalog-results-bar">
      <p class="catalog-count" role="status" aria-live="polite"></p>
      <button type="button" class="catalog-reset" hidden>Clear filters</button>
    </div>
    <section aria-label="Upgrade cards" class="catalog-grid"></section>
    <p class="catalog-empty" hidden></p>
    <noscript><p class="catalog-empty">Enable JavaScript to browse the card catalog.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-bar">
      <a class="text-link" href="./index.html">Back to StatsShooter</a>
      <a class="text-link" href="#top">Back to top <span aria-hidden="true">↑</span></a>
    </div>
  </footer>
</body>
</html>

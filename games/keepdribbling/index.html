<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KeepDribbling — Play</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141519;color:#f1f0ed;font-family:Arial,sans-serif}
    canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:16px;padding:24px;background:#17181c;font-size:14px;line-height:1.6}#loading[hidden]{display:none}progress{width:min(300px,65vw);height:8px;accent-color:#bbc1f8;margin:auto}#status{max-width:520px}a{color:#bbc1f8}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="KeepDribbling game. Use A and D or left and right arrow keys to change lanes, and W and S to retrieve the ball. Follow the on-screen action prompts."></canvas>
  <div id="loading"><div id="status" role="status" aria-live="polite">Loading KeepDribbling…</div><progress id="progress" max="1" value="0" aria-label="Game loading progress"></progress></div>
  <script src="player.js"></script>
</body>
</html>

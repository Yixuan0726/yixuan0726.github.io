<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>EyeDle</title>
  <link rel="stylesheet" href="./game.css">
</head>
<body>
  <main id="player">
    <label id="language-control"><span class="language-brand" aria-hidden="true">EyeDle</span><span class="sr-only">语言 / Language</span><select id="language" aria-label="语言 / Language"><option value="zh">中文</option><option value="en">English</option></select></label>
    <canvas id="unity-canvas" tabindex="0" aria-label="EyeDle game"></canvas>
    <section id="welcome" aria-labelledby="game-title">
      <div class="card">
        <p class="brand">EyeDle</p>
        <h1 id="game-title">A little time for your eyes.</h1>
        <p>Play with your front camera. Face the screen in comfortable light.</p>
        <button id="start">Start playing</button>
        <p id="status" role="status" aria-live="polite">Open in Safari on iPhone. No account needed.</p>
        <p class="privacy">Camera processing stays on this device.<br>No images or video are saved or uploaded.</p>
      </div>
    </section>
    <aside id="resume" hidden>
      <p id="resume-status">Camera paused.</p>
      <button id="resume-input">Resume camera</button>
    </aside>
  </main>
  <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
  <script type="module" src="./game.js?v=69034122c64e067d"></script>
</body>
</html>

<title id="title">EyeDle care, workshop and exploration loop</title>
<desc id="desc">Formal care earns Care Energy for production. Bottle sales and optional Search earn coins. Eight hours after formal care ends, care is available again; earlier returns require one minute of rest. Completion requires both 24 cumulative care routines and all upgrades maxed.</desc>
